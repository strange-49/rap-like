# nginx load balancer for UrbanRide: one public address (8080) in front of two backend instances.
#
#   Browser / rider app  ->  nginx :8080  ->  backend :3001  and  backend :3002
#
# Run it (from the folder where nginx is installed; on Windows that is where nginx.exe is):
#   nginx -c <full path to this file>
# Reload after editing:   nginx -s reload        Stop:   nginx -s stop
# See deploy/LOAD-BALANCING.md for the full walkthrough.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # WebSocket support: forward the Upgrade handshake, but send an empty
    # Connection header for normal requests so upstream keep-alive works.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream urbanride_api {
        # least_conn sends new connections to the instance with the fewest open
        # ones, which suits long-lived WebSockets better than plain round-robin.
        least_conn;

        # If an instance fails twice it is skipped for 10 s (passive health check).
        server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=2 fail_timeout=10s;

        keepalive 32;
    }

    server {
        listen 8080;

        # Slightly above the backend's own 64 KiB body limit (the backend answers 413).
        client_max_body_size 256k;

        location / {
            proxy_pass http://urbanride_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            # WebSockets stay open for hours; the backend pings every 30 s.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Retry another instance on connection errors. (nginx only retries
            # idempotent requests such as GET, never a POST, so no double bookings.)
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
